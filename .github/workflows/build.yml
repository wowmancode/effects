name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build, lint, and test
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug assembleRelease lint test 2>&1 | tee build-output.txt
      - name: Annotate build errors
        if: failure()
        run: |
          # Kotlin compiler errors ("e: file:///path:line:col message") and test/lint failures
          # become annotations, readable on the run page without opening the raw log.
          grep -E '^e: ' build-output.txt | head -40 | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\2,line=\3,col=\4::\5#' || true
          grep -E 'FAILED|What went wrong|Lint found|Error: ' -A4 build-output.txt | head -60 | sed 's/^/::error::/' || true
      - name: Build and test the online relay server
        run: |
          set -o pipefail
          gradle --no-daemon -p relay-server build 2>&1 | tee relay-output.txt
      - name: Annotate relay server errors
        if: failure()
        run: |
          grep -E '^e: ' relay-output.txt | head -40 | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\2,line=\3,col=\4::\5#' || true
          grep -E 'FAILED|What went wrong|Exception|expected:' -A6 relay-output.txt | head -60 | sed 's/^/::error::/' || true
      - name: Test native C compiler audio and video
        run: bash scripts/test-native-c.sh
      - name: Report release APK sizes
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "$(basename "$apk"): $(stat -c%s "$apk") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            unzip -l "$apk" | awk '/liblec_native_c.so/ {print "  Native C compiler: " $1 " bytes (uncompressed)"}' | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-arm64-v8a-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-armeabi-v7a-release
          path: app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-x86-release
          path: app/build/outputs/apk/release/app-x86-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-x86_64-release
          path: app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
      - name: Test split-pitch C processor (Methods 2 and 3 reconstruction)
        run: |
          set -e
          C=core-effects/src/main/c
          # Reconstructed DSP: the A17 reference vectors, then the translated blocks as objects.
          make -C $C/elastique -j"$(nproc)" test-a17 build/image.o \
            $(cd $C/elastique && ls generated/blocks_*.c | sed 's#generated/\(.*\)\.c#build/\1.o#')
          gcc -std=c11 -O2 -ffp-contract=off -fno-fast-math -w -I$C -c $C/reconstructed_pitch.c -o /tmp/rp.o
          gcc -std=c11 -O2 -ffp-contract=off -Wall -Wextra -Werror -I$C -c $C/elastique/a17.c -o /tmp/a17.o
          gcc -std=c11 -O2 -ffp-contract=off -Wall -Wextra -Werror -I$C \
            $C/split_pitch_modes.c core-effects/src/test/c/split_pitch_modes_test.c \
            /tmp/rp.o /tmp/a17.o $C/elastique/build/blocks_*.o $C/elastique/build/image.o \
            -lm -lpthread -o /tmp/split_pitch_modes_test
          /tmp/split_pitch_modes_test
          # 32-bit builds compile the reconstruction out and keep Original.
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I$C -DRECON_PITCH_DISABLED \
            $C/reconstructed_pitch.c $C/split_pitch_modes.c core-effects/src/test/c/split_pitch_modes_test.c \
            -lm -o /tmp/split_pitch_original_test
          /tmp/split_pitch_original_test
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-debug
          path: app/build/outputs/apk/debug/*.apk
      # Ready-to-run relay server (needs Java 17). A .tar keeps the start script executable.
      - uses: actions/upload-artifact@v4
        with:
          name: effect-app-relay
          path: relay-server/build/distributions/*.tar


  native-android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :core-effects:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c-android-tests
          path: core-effects/build/reports/androidTests/
